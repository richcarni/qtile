    asan-tests:
        runs-on: ubuntu-24.04
        name: "ASan wayc (python ${{ matrix.python-version }})"
        strategy:
            matrix:
                python-version: ['3.14']
        steps:
            - uses: actions/checkout@v6
            - name: Build base Docker image
              run: |
                docker buildx build -t qtile-ci .
            - name: Build ASan Docker image
              run: |
                docker buildx build -f ./Dockerfile.asan -t qtile-ci . 
            - name: Run tests under ASan
              run: |
                make asan-ci-check
              env:
                QTILE_CI_PYTHON: ${{ matrix.python-version }}
                QTILE_CI_BACKEND: wayland
                GLYCIN_DISABLE_SANDBOX: "i-know-the-risks"
                ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:symbolize=1:log_path=/workspace/asan.log:log_exe_name=1
                # LSAN_OPTIONS: exitcode=0
            - name: List ASan log files
              if: failure()
              run: |
                echo "ASan log files found:"
                ls -la asan*.log* 2>/dev/null || echo "No matching files found."
            - name: Upload ASan log
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                name: asan-log
                path: asan*.log*

