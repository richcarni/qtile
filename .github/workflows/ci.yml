name: ci
on:
    push:
    pull_request:
jobs:
    build:
        runs-on: ubuntu-24.04
        container:
            image: fedora:44
            options: --privileged
        name: "python ${{ matrix.python-version }} on ${{ matrix.backend }}"
        strategy:
            matrix:
                python-version: ['3.12', '3.13', '3.14']
                backend: ['x11', 'wayland']
        steps:
            - name: Install git first (required for checkout in container)
              run: |
                dnf install -y git

            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0  # Fetch full git history for setuptools-scm

            - name: Fix git ownership (required for containers)
              run: |
                git config --global --add safe.directory /__w/qtile/qtile

            - name: Install system dependencies
              run: |
                dnf install -y \
                  python${{ matrix.python-version }} \
                  python${{ matrix.python-version }}-devel \
                  make \
                  gcc \
                  gcc-c++ \
                  which \
                  findutils \
                  systemd \
                  dbus-devel \
                  gobject-introspection-devel \
                  gtk3 \
                  gtk3-devel \
                  libnotify \
                  libnotify-devel \
                  libgudev \
                  libgudev-devel \
                  graphviz \
                  ImageMagick \
                  xorg-x11-server-Xephyr \
                  xorg-x11-server-Xvfb \
                  dbus-x11 \
                  xcb-util-devel \
                  xcb-util-image-devel \
                  xcb-util-keysyms-devel \
                  xcb-util-renderutil-devel \
                  xcb-util-wm-devel \
                  libxcb-devel \
                  libxkbcommon-devel \
                  python3-gobject \
                  cairo-devel \
                  gdk-pixbuf2-devel \
                  librsvg2-devel \
                  xcb-util-cursor \
                  xterm \
                  pulseaudio-libs \
                  wget \
                  tar \
                  gzip \
                  xz

            - name: Set up uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"
                  python-version: ${{ matrix.python-version }}

            - name: Install Wayland build dependencies
              # if: matrix.backend == 'wayland'
              run: |
                dnf install -y \
                  wayland-devel \
                  wayland-protocols-devel \
                  mesa-libEGL-devel \
                  mesa-libgbm-devel \
                  mesa-libGLES-devel \
                  libglvnd-devel \
                  libepoxy-devel \
                  libinput-devel \
                  libpciaccess-devel \
                  xcb-util-errors-devel \
                  libXfont2-devel \
                  libxshmfence-devel \
                  libtirpc-devel \
                  xorg-x11-font-utils \
                  xorg-x11-server-devel \
                  ninja-build \
                  meson \
                  libdrm-devel \
                  pixman-devel \
                  hwdata \
                  systemd-devel \
                  gdb \
                  xorg-x11-server-Xwayland \
                  seatd \
                  wlroots0.19-devel

            - name: Clean python version and export to env
              shell: bash
              run: |
                PYTHON_VERSION="${{ matrix.python-version }}"
                CLEAN_VERSION="${PYTHON_VERSION%-dev}"
                echo "QTILE_CI_PYTHON=${CLEAN_VERSION}" >> $GITHUB_ENV

            - name: Run Tests
              run: |
                [ "$(grep -c -P '\t' CHANGELOG)" = "0" ]
                dump_cores() {
                  echo "=== Listing coredumps ==="
                  coredumpctl list || true
                  echo "=== Stack trace for last coredump ==="
                  coredumpctl debug --debugger-arguments="-batch -ex 'set pagination off' -ex 'bt full' -ex 'quit'" || true
                }
                trap dump_cores ERR
                make QTILE_CI_PYTHON=${QTILE_CI_PYTHON} QTILE_CI_BACKEND=${{ matrix.backend }} check check-packaging
                uv run coverage combine -q
                uv run coverage report -m
                uv run coverage xml

            - name: Upload coverage data to coveralls.io
              continue-on-error: true
              run: |
                uv tool run coveralls --service=github
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                COVERALLS_FLAG_NAME: ${{ format('{0}-{1}', matrix.python-version, matrix.backend) }}
                COVERALLS_PARALLEL: true
                COVERALLS_SERVICE_JOB_ID: ${{ github.run_id }}

    coverage:
        name: Finalize Coverage
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - name: Coveralls Finished
              uses: coverallsapp/github-action@main
              with:
                github-token: ${{ secrets.GITHUB_TOKEN }}
                parallel-finished: true
